  <main>
    <h1><font color="#ff69b4">Contact</font></h1>
    <h2><font color="#ff1493">Contact Me</font></h2>
    <p>Fill out the form below with your information.</p>
    
    <form action="#" method="post">
      <p><label>Full Name:<br><input type="text" name="fullname" required></label></p>
      <p><label>Email:<br><input type="email" name="email" required></label></p>
      <p><label>Phone:<br><input type="tel" name="phone"></label></p>
      <p>Gender:
        <input type="radio" name="gender" value="male"> Male
        <input type="radio" name="gender" value="female"> Female
        <input type="radio" name="gender" value="other"> Other
      </p>
      <p><label>Subject:<br>
        <select name="subject">
          <option>General Inquiry</option>
          <option>Services</option>
          <option>Feedback</option>
        </select></label></p>
      <p><label>Message:<br><textarea name="message" rows="5" cols="40"></textarea></label></p>
      <p><input type="submit" value="Send"> <input type="reset" value="Clear"></p>
    </form>
  </main>
